services:
  - type: web
    name: shl-assessment-recommender
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
      - key: VECTOR_STORE_PATH
        value: data/faiss.index
      - key: CATALOG_PATH
        value: data/catalog.json
      - key: CATALOG_METADATA_PATH
        value: data/catalog_metadata.json
      - key: EMBED_MODEL
        value: all-MiniLM-L6-v2
      - key: MAX_TURNS
        value: "8"
      - key: REQUEST_TIMEOUT_S
        value: "30"
      - key: TOP_K_RETRIEVAL
        value: "15"
